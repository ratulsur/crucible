<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crucible — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
<div class="db-layout">

  <!-- Sidebar -->
  <aside class="db-sidebar">
    <div class="db-brand">
      <span class="wordmark" style="font-size:1.6rem">Crucible</span>
    </div>
    <nav class="db-nav">
      <a href="/dashboard" class="db-nav-item active">Dashboard</a>
      <a href="/" class="db-nav-item">New Interview</a>
    </nav>
    <div class="db-user-row">
      <span id="db-username" class="db-username"></span>
      <button id="btn-logout" class="mini">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="db-main">
    <div class="db-header">
      <h2 class="db-title">Interview History</h2>
    </div>

    <!-- Stats row -->
    <div class="db-stats" id="db-stats"></div>

    <!-- Session cards -->
    <div id="db-sessions" class="db-sessions">
      <p class="status-line" id="db-loading">Loading your interviews…</p>
    </div>
  </main>
</div>

<!-- Report modal -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <button id="modal-close" class="modal-close mini">✕ Close</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/web/dashboard.js"></script>
</body>
</html>
